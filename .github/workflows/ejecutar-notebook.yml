name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'notebooks/etfbook_flows_colab.ipynb'
          TEXTO = '[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/ETFbook-data-analytics-case-study/blob/main/notebooks/etfbook_flows_colab.ipynb)\n\n> **En 30 segundos:** 4 ETFs y 3 meses: SPY se lleva el 40 % del flujo neto y 3 de 12 combinaciones ETF-mes cierran con salidas.\n>\n> - SPY: 16.100 millones de USD (39,9 % del flujo del trimestre)\n> - 3 de 12 combinaciones ETF-mes en negativo\n> - Extracto trimestral: describe el periodo, no es tendencia\n>\n> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "notebooks/etfbook_flows_colab.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notebooks/etfbook_flows_colab.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
